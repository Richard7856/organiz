<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Organiz{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <h1 class="brand">💰 Organiz</h1>
      <nav class="nav">
        <a href="{{ url_for('index') }}" class="nav__link">Panel</a>
        <a href="{{ url_for('projects_page') }}" class="nav__link">Proyectos</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">
      <small>Organiz · finanzas y proyectos</small>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
