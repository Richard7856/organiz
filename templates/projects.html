{% extends "base.html" %}
{% block title %}Proyectos · Organiz{% endblock %}

{% block content %}
<div class="layout">
  <!-- Formulario para crear un proyecto -->
  <section class="panel">
    <h2 class="panel__title">Nuevo proyecto</h2>
    <form id="project-form" class="form">
      <label class="field">
        <span>Nombre</span>
        <input type="text" name="name" placeholder="Mi proyecto" maxlength="120" required>
      </label>

      <label class="field">
        <span>Descripción</span>
        <textarea name="description" rows="3" placeholder="Opcional" maxlength="500"></textarea>
      </label>

      <label class="field">
        <span>Estado</span>
        <select name="status">
          <option value="active">En curso</option>
          <option value="paused">En pausa</option>
          <option value="completed">Terminado</option>
        </select>
      </label>

      <button type="submit" class="btn btn--primary">Crear proyecto</button>
      <p class="form__error" id="form-error" role="alert"></p>
    </form>
  </section>

  <!-- Lista de proyectos -->
  <section class="panel">
    <h2 class="panel__title">Mis proyectos</h2>
    <div id="projects-list">
      <p class="empty">Cargando…</p>
    </div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/projects.js') }}"></script>
{% endblock %}
